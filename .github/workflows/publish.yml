name: Publish

# Single npm publisher, driven by the branch:
#   staging -> release-candidate snapshot under the `rc` dist-tag
#   main    -> maintains the `chore: release` PR; publishes nothing
#   v* tag  -> production release (`latest`), only from a signed annotated tag
#              that GitHub verifies, created and pushed by a maintainer
#
# Both publishes go through npm trusted publishing (OIDC), so this one workflow
# file is the single registered trusted publisher on the npm package and no
# NPM_TOKEN is stored. Every publish carries a provenance attestation.
# Automation never creates a git tag.
on:
  push:
    branches: [main, staging]
    tags: ["v*", "!v*-*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # `chore: release` PR maintenance on main. changesets/action opens and
  # updates the `chore: release` PR (branch changeset-release/main)
  # while changesets are pending. It neither tags nor publishes; a maintainer tags the merged version commit (see
  # README "Releasing"). Attributed to the Release Manager App.
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity for the release bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          user_id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${user_id}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Create or update the release PR
        uses: changesets/action@v1
        with:
          title: "chore: release"
          commit: "chore: version packages"
          version: npm run changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Release candidate from staging. Publishes a Changesets snapshot
  # (X.Y.Z-rc-<timestamp>) under the `rc` dist-tag so downstreams can test with
  # `npm i @lerna-labs/ekklesia-helpers@rc`. Nothing is committed; the `rc` tag
  # never moves `latest`. Skipped when there are no pending changesets (the
  # snapshot would otherwise equal the released version already on npm).
  rc:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: npm ci

      - name: Compute snapshot RC version
        id: rc
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -1)
          if [ -n "$pending" ]; then
            npx changeset version --snapshot rc
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "has_rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rc=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets; nothing to publish as a release candidate."
          fi

      - name: Build
        if: steps.rc.outputs.has_rc == 'true'
        run: npm run build

      - name: Publish rc snapshot to npm
        if: steps.rc.outputs.has_rc == 'true'
        # --no-git-checks: the working tree is intentionally dirty from the
        # snapshot bump, which is discarded next and never committed.
        run: npm publish --tag rc --no-git-checks

      - name: Discard snapshot bump
        run: git checkout -- .

  # Tag verification. The publish job needs this one.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"

  # Production release from a verified tag. Publishes `latest` to npm through
  # OIDC trusted publishing, then creates the GitHub Release with the
  # CHANGELOG section as notes, attributed to the Release Manager App.
  publish:
    needs: verify-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_MANAGER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 20 ships npm 10.
      # Pin to 11 (not latest): npm 12 requires node 22+.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - run: npm ci

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p=($2==v);next} p' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No CHANGELOG.md section found for $version."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
